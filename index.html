
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Enhance and Add Screens</title>
      
      <!-- Preload critical fonts to prevent layout shifts -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
      
      <!-- Font display strategy to prevent layout shifts -->
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        /* Fallback fonts while custom fonts load */
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        }
        
        /* Apply custom fonts when loaded */
        .fonts-loaded body {
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        }
        
        html, body { height: 100%; margin: 0; } 
        #root { height: 100%; }
        
        /* Prevent font swap layout shift */
        * {
          font-display: swap;
        }
      </style>
    </head>

    <body>
      <div id="root"></div>
      
      <!-- Font loading detection script -->
      <script>
        // Detect when fonts are loaded and add class to prevent layout shifts
        if ('fonts' in document) {
          Promise.all([
            document.fonts.load('400 1em Inter'),
            document.fonts.load('600 1em Inter'),
            document.fonts.load('700 1em Inter'),
            document.fonts.load('400 1em Plus Jakarta Sans'),
            document.fonts.load('600 1em Plus Jakarta Sans'),
            document.fonts.load('700 1em Plus Jakarta Sans'),
            document.fonts.load('800 1em Plus Jakarta Sans')
          ]).then(function() {
            document.documentElement.classList.add('fonts-loaded');
          });
        } else {
          // Fallback for browsers that don't support font loading API
          document.documentElement.classList.add('fonts-loaded');
        }
      </script>
      
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
